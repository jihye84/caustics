<!DOCTYPE html>

<head>

<title>빛그물 — 코스틱스 감상</title>
<script>
/* 카카오톡·네이버·페이스북·인스타그램 등 인앱 브라우저에서 열리면 기본 브라우저로 다시 열기 */
(function () {
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|FB_IAB|Instagram|Line\/|DaumApps|everytimeApp|wv\)/i.test(ua);
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
    location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1'; return;
  }
  if (!inApp) return;
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; return;
  }
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(13,17,32,.94);color:#eef0f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 system-ui,sans-serif';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 일부 기능이 제대로 작동하지 않을 수 있어요.<br>⋯ 메뉴에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button id="copyUrl" style="font:inherit;padding:10px 18px;border-radius:999px;border:0;background:#eef0f8;color:#0d1120">주소 복사</button>' +
      '<button id="stayHere" style="font:inherit;background:none;border:0;color:#9aa3c0;text-decoration:underline">그냥 여기서 보기</button>';
    document.body.appendChild(box);
    document.getElementById('copyUrl').onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        function () { b.textContent = '복사했어요'; }, function () { prompt('주소를 복사하세요', url); });
    };
    document.getElementById('stayHere').onclick = function () { box.remove(); };
  });
})();
</script>
<style>
:root{--ink:#eef0f8;--mut:#9aa3c0;--panel:rgba(12,15,26,.80);--line:rgba(255,255,255,.12);--acc:#ffd38a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05070d;color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c2{display:none;pointer-events:none;z-index:0}
#gl{z-index:1}
#title{position:fixed;z-index:2;top:max(12px,env(safe-area-inset-top));left:16px;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 10px rgba(0,0,0,.45)}
#title b{font-size:clamp(17px,2.4vh,24px);letter-spacing:.04em}
#title span{display:block;font-size:clamp(11px,1.4vh,14px);color:var(--mut);margin-top:2px}
#chip{position:fixed;z-index:2;top:max(12px,env(safe-area-inset-top));right:16px;padding:6px 12px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:clamp(12px,1.5vh,15px);color:var(--acc);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;transition:opacity .3s}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));
  display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5;max-width:calc(100vw - 16px)}
#bar button{font:inherit;font-size:clamp(14px,1.8vh,18px);min-height:clamp(44px,5.4vh,58px);padding:0 clamp(12px,1.6vw,22px);
  border:0;border-radius:999px;background:transparent;color:var(--mut);cursor:pointer;white-space:nowrap}

#bar #tgl.on{background:var(--acc);color:#24180a}
#panel{position:fixed;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:16px 18px;display:flex;flex-direction:column;gap:12px;
  overflow:auto;transition:opacity .25s,transform .25s}

/* 좁은 화면: 아래 서랍 */
#panel{left:8px;right:8px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + clamp(58px,7vh,72px));max-height:58vh}
@media not ((orientation:landscape) and (min-width:700px)){
  #panel{padding:12px 14px;gap:8px}

}
#panel.hide{transform:translateY(16px)}
/* 가로로 넓은 화면: 오른쪽 패널 */
@media (orientation:landscape) and (min-width:700px){
  #panel{left:auto;right:12px;top:max(12px,env(safe-area-inset-top));bottom:calc(max(12px,env(safe-area-inset-bottom)) + clamp(60px,7vh,76px));
    width:clamp(260px,24vw,340px);max-height:none}
  #panel.hide{transform:translateX(16px)}
  #chip{right:calc(clamp(260px,24vw,340px) + 28px)}
  body.closed #chip{right:16px}
}
#info .tag{font-size:12px;color:var(--acc);letter-spacing:.05em}
#info h2{font-size:clamp(16px,2vh,20px);margin:2px 0 6px}
#info p{font-size:clamp(13px,1.55vh,15px);line-height:1.6;color:#c9cee0;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(4 * 1.6em)}
.row{display:flex;flex-direction:column;gap:6px}
.row .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}

.seg{display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:12px;padding:3px}

input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--acc);border:0}
#hint{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + clamp(66px,8vh,84px));transform:translateX(-50%);
  padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.55);font-size:clamp(13px,1.6vh,16px);color:#fff;
  pointer-events:none;opacity:0;transition:opacity .5s;white-space:nowrap;z-index:3}

button.plain{font:inherit;font-size:13px;min-height:38px;padding:0 12px;white-space:nowrap;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--mut);padding:24px}
</style>

<body>
<canvas id="gl"></canvas>
<canvas id="c2"></canvas>
<div id="nogl">이 기기(브라우저)에서는 WebGL2가 켜지지 않아 빛을 그릴 수 없어요.<br>크롬이나 사파리 최신 버전에서 열어 주세요.</div>

<div id="title"><b>빛그물</b><span>코스틱스 감상실</span></div>
<div id="chip"></div>

<div id="dial" aria-label="해의 위치"><svg viewBox="0 0 92 92" width="92" height="92">
  <circle cx="46" cy="46" r="38" fill="rgba(12,15,26,.72)" stroke="rgba(255,255,255,.18)"/>
  <circle cx="46" cy="46" r="20" fill="none" stroke="rgba(255,255,255,.10)"/>
  <text x="46" y="86" text-anchor="middle" font-size="9" fill="#9aa3c0">내 쪽</text>
  <rect x="42" y="42" width="8" height="8" rx="2" fill="rgba(220,235,255,.6)"/>
  <circle id="sunDot" cx="46" cy="20" r="7" fill="#ffd38a"/>

</svg></div>

  <button id="tgl">조절</button>

<script>
(() => {
const $ = s => document.querySelector(s);
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && innerWidth < 1100);
let W = 0, H = 0, DPR = 1;

const st = {
  scene: 0,
  wave: { surf: 0, amp: 1, depth: 1.6, disp: 0, speed: 1 },
  cup:  { el: 26, az: 192, h: 0.5, drink: 0, hd: 325 },
  gls:  { g: 0, el: 38, az: 125, tilt: [0,0], disp: 2, table: 0 }
};
const SURF_DEF = [ {disp:0}, {disp:7}, {disp:0} ];

/* ---------- 파장(색) 8개: 합치면 흰빛 ---------- */
const LAMBDA = [420, 450, 480, 510, 545, 580, 615, 660];
function wlRGB(l){
  let r=0,g=0,b=0;
  if(l<440){r=-(l-440)/60*0.6;b=1;} else if(l<490){g=(l-440)/50;b=1;}
  else if(l<510){g=1;b=-(l-510)/20;} else if(l<580){r=(l-510)/70;g=1;}
  else if(l<645){r=1;g=-(l-645)/65;} else {r=1;}
  return [r,g,b];
}
const BAND = (() => {
  const c = LAMBDA.map(wlRGB), s=[0,0,0];
  c.forEach(v=>{s[0]+=v[0];s[1]+=v[1];s[2]+=v[2];});
  return c.map(v=>[v[0]/s[0],v[1]/s[1],v[2]/s[2]]);   // 8개를 더하면 (1,1,1)
})();
const iorOf = (n0, disp, l) => n0 + 0.02*disp*((550/l)*(550/l)-1);

/* ---------- 화면 요소 ---------- */
const glc = $('#gl'), c2 = $('#c2'), ctx = c2.getContext('2d');
const panel = $('#panel'), tgl = $('#tgl');
const isSide = () => matchMedia('(orientation:landscape) and (min-width:700px)').matches;

let hintT;
function hint(msg){ const h=$('#hint'); h.textContent=msg; h.classList.add('show'); clearTimeout(hintT); hintT=setTimeout(()=>h.classList.remove('show'),3200); }
function chip(msg){ const c=$('#chip'); c.textContent=msg; c.style.opacity=msg?1:0; }

/* ========== 1. 물결 장면 (WebGL2, 실제 굴절 계산) ========== */
const gl = glc.getContext('webgl2', {antialias:false, alpha:false, preserveDrawingBuffer:false});
let G = null;
const VS = `#version 300 es
precision highp float;
in vec2 aGrid;
uniform vec2 uExt, uView;
uniform float uTime, uAmp, uDepth, uIor;
uniform int uMode;
uniform vec4 uDrops[16];
out vec2 vOld; out vec2 vNew;
const float PI=3.14159265;
float height(vec2 p){
  float t=uTime, h=0.;
  if(uMode==1){
    float u = p.x + 0.30*p.y*p.y - 0.22*p.y + 0.25*sin(t*0.12);
    h += 0.15*sin(3.0*u);
    h += 0.0034*sin(25.0*p.x);
    h += 0.0012*sin(25.0*p.x*1.93+1.7);
  } else {
    float calm = uMode==2 ? 0.28 : 1.0;
    vec3 wv[7] = vec3[7](vec3(0.30,9.,1.),vec3(1.25,11.,1.),vec3(2.05,13.,.9),vec3(2.95,8.,1.),
                         vec3(3.85,15.,.8),vec3(4.65,10.,1.),vec3(5.55,12.,.9));
    for(int i=0;i<7;i++){
      float a=wv[i].x, k=wv[i].y;
      vec2 d=vec2(cos(a),sin(a));
      h += calm*wv[i].z*1.45/(k*k)*sin(dot(p,d)*k - sqrt(k)*1.1*t + float(i)*1.7);
    }
  }
  for(int i=0;i<16;i++){
    vec4 d=uDrops[i];
    if(d.w<=0.) continue;
    float age=t-d.z;
    if(age<0.||age>7.) continue;
    float r=length(p-d.xy);
    float x=r-age*0.45;
    float env=exp(-x*x*30.)*exp(-age*0.55)/(1.+r*2.5);
    h += d.w*0.0022*env*cos(x*34.);
  }
  return h*uAmp;
}
void main(){
  vec2 p=(aGrid*2.-1.)*uExt;
  float e=0.0025;
  float hx=(height(p+vec2(e,0.))-height(p-vec2(e,0.)))/(2.*e);
  float hy=(height(p+vec2(0.,e))-height(p-vec2(0.,e)))/(2.*e);
  vec3 n=normalize(vec3(-hx,-hy,1.));
  vec3 L=normalize(vec3(0.12,0.18,-1.));
  vec3 r=refract(L,n,1./uIor);
  vec3 r0=refract(L,vec3(0.,0.,1.),1./uIor);
  vec2 hit=p + r.xy*(uDepth/-r.z) - r0.xy*(uDepth/-r0.z);
  vOld=p; vNew=hit;
  gl_Position=vec4(hit/uView,0.,1.);
}`;
const FS = `#version 300 es
precision highp float;
in vec2 vOld; in vec2 vNew;
uniform vec3 uCol;
out vec4 o;
void main(){
  vec2 ax=dFdx(vOld), ay=dFdy(vOld), bx=dFdx(vNew), by=dFdy(vNew);
  float a0=abs(ax.x*ay.y-ax.y*ay.x), a1=abs(bx.x*by.y-bx.y*by.x);
  float I=min(a0/max(a1,1e-14),60.);
  o=vec4(uCol*I,1.);
}`;
const PVS = `#version 300 es
in vec2 aP; out vec2 vUv;
void main(){ vUv=aP*.5+.5; gl_Position=vec4(aP,0.,1.); }`;
const PFS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uView; uniform int uMode; uniform float uBack;
void main(){
  vec3 L=texture(uTex,vUv).rgb/uBack;
  vec2 w=(vUv*2.-1.)*uView;
  vec3 alb; float amb, ex;
  if(uMode==1){
    alb=vec3(.80,.78,.74); amb=.16; ex=.42;
    float g=abs(fract(w.x*4.)-.5); alb*=1.-.05*smoothstep(.45,.5,g);
  } else {
    vec2 g=abs(fract(w*4.2)-.5);
    float line=smoothstep(.455,.5,max(g.x,g.y));
    alb=mix(vec3(.50,.80,.90),vec3(.30,.55,.68),line*.7);
    amb=.14; ex=.5;
  }
  vec3 c=alb*(amb+L*ex);
  vec2 q=vUv-.5; c*=1.-.45*dot(q,q);
  c=1.-exp(-c*1.7);
  if(uMode!=1) c=mix(c,c*vec3(.72,.96,1.08),.45);
  o=vec4(pow(c,vec3(.92)),1.);
}`;

function initGL(){
  if(!gl){ return false; }
  try{
    const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
      if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x;};
    const pr=(v,f)=>{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));
      gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;};
    G = { p: pr(VS,FS), pp: pr(PVS,PFS) };
    G.u = n => gl.getUniformLocation(G.p,n);
    G.uq = n => gl.getUniformLocation(G.pp,n);
    G.float = !!gl.getExtension('EXT_color_buffer_float');
    G.back = G.float ? 1 : 0.08;
    // 화면 전체 삼각형
    G.qv = gl.createVertexArray(); gl.bindVertexArray(G.qv);
    const qb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,qb);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const la=gl.getAttribLocation(G.pp,'aP'); gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
    G.gv = gl.createVertexArray(); G.gb = gl.createBuffer(); G.ib = gl.createBuffer();
    G.tex = gl.createTexture(); G.fb = gl.createFramebuffer();
    return true;
  }catch(e){ console.error(e); G=null; return false; }
}
let view=[1,1], ext=[1,1];
function sizeGL(){
  if(!G) return;
  glc.width=Math.round(W*DPR); glc.height=Math.round(H*DPR);
  view = W>H ? [W/H,1] : [1,H/W];
  ext = [view[0]*1.12, view[1]*1.12];
  const short = /[?&]lo/.test(location.search) ? 80 : (isMobile ? 150 : 220);
  const m = Math.min(ext[0],ext[1]);
  const nx = Math.round(short*ext[0]/m), ny = Math.round(short*ext[1]/m);
  const pos = new Float32Array((nx+1)*(ny+1)*2);
  let k=0; for(let j=0;j<=ny;j++) for(let i=0;i<=nx;i++){ pos[k++]=i/nx; pos[k++]=j/ny; }
  const idx = new Uint32Array(nx*ny*6); k=0;
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const a=j*(nx+1)+i, b=a+1, c=a+nx+1, d=c+1;
    idx[k++]=a;idx[k++]=b;idx[k++]=c; idx[k++]=b;idx[k++]=d;idx[k++]=c;
  }
  G.count = idx.length;
  gl.bindVertexArray(G.gv);
  gl.bindBuffer(gl.ARRAY_BUFFER,G.gb); gl.bufferData(gl.ARRAY_BUFFER,pos,gl.STATIC_DRAW);
  const la=gl.getAttribLocation(G.p,'aGrid'); gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,G.ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  gl.bindTexture(gl.TEXTURE_2D,G.tex);
  if(G.float) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,glc.width,glc.height,0,gl.RGBA,gl.HALF_FLOAT,null);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,glc.width,glc.height,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.bindFramebuffer(gl.FRAMEBUFFER,G.fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,G.tex,0);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE && G.float){
    G.float=false; G.back=0.08; sizeGL(); return;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
const drops = new Float32Array(64); let dropI=0, simT=0, nextRain=0;
function addDrop(x,y,s){ drops.set([x,y,simT,s],dropI*4); dropI=(dropI+1)%16; }
function renderGL(){
  const w=st.wave, mode=w.surf;
  const n0 = mode===1 ? 1.5 : 1.333;
  gl.bindFramebuffer(gl.FRAMEBUFFER,G.fb);
  gl.viewport(0,0,glc.width,glc.height);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(G.p); gl.bindVertexArray(G.gv);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.uniform2f(G.u('uExt'),ext[0],ext[1]); gl.uniform2f(G.u('uView'),view[0],view[1]);

/* ---------- 머그잔: 햇빛 → 잔 안쪽 벽에서 반사 → 음료 표면 (3D 광선 추적) ---------- */
const MUG={T:58*Math.PI/180, Hc:1.9, rO:1.08};
const DRINK=[[0.20,0.11,0.06],[0.62,0.42,0.25],[0.93,0.91,0.86]];
let mugTex=null, mugKey='';
function sunVec(){ const c=st.cup, el=c.el*Math.PI/180, az=c.az*Math.PI/180;
  return [Math.cos(el)*Math.cos(az), Math.cos(el)*Math.sin(az), Math.sin(el)]; }
function mugSurface(){
  const c=st.cup, key=[c.el,c.az,c.h,c.drink].join();
  if(key===mugKey && mugTex) return mugTex;
  mugKey=key;
  const N=isMobile?220:300, R=N/2, buf=new Float32Array(N*N);
  const s=sunVec(), dx=-s[0], dy=-s[1], dz=-s[2], vv=dx*dx+dy*dy, h=c.h;
  const splat=(x,y,w)=>{
    const fx=(x+1)*R-0.5, fy=(1-y)*R-0.5, ix=Math.floor(fx), iy=Math.floor(fy), ax=fx-ix, ay=fy-iy;
    if(ix<0||iy<0||ix>=N-1||iy>=N-1) return;
    const k=iy*N+ix;
    buf[k]+=w*(1-ax)*(1-ay); buf[k+1]+=w*ax*(1-ay); buf[k+N]+=w*(1-ax)*ay; buf[k+N+1]+=w*ax*ay;
  };
  const sq=Math.ceil(Math.sqrt((isMobile?320000:750000)*4/Math.PI));
  let cnt=0;
  for(let j=0;j<sq;j++) for(let i=0;i<sq;i++){
    let x=((i+Math.random())/sq)*2-1, y=((j+Math.random())/sq)*2-1;
    if(x*x+y*y>=1) continue; cnt++;
    let z=0, vx=dx, vy=dy, w=1;
    for(let b=0;b<3;b++){
      const tp=(z+h)/(-dz);
      const B=x*vx+y*vy, C=x*x+y*y-1, tw=(-B+Math.sqrt(Math.max(0,B*B-vv*C)))/vv;
      if(tp<=tw){ splat(x+vx*tp, y+vy*tp, w); break; }
      x+=vx*tw; y+=vy*tw; z+=dz*tw;
      const nn=x*vx+y*vy; vx-=2*nn*x; vy-=2*nn*y;   // 둥근 벽에서 거울 반사
      w*=0.6;
    }
  }
  // 살짝 흐리게 (3×3)
  const bl=new Float32Array(N*N);
  for(let y=1;y<N-1;y++) for(let x=1;x<N-1;x++){
    const k=y*N+x;
    bl[k]=(buf[k]*4+buf[k-1]*2+buf[k+1]*2+buf[k-N]*2+buf[k+N]*2+buf[k-N-1]+buf[k-N+1]+buf[k+N-1]+buf[k+N+1])/16;
  }
  const norm=Math.PI/(cnt*(4/(N*N)));
  const cv=document.createElement('canvas'); cv.width=cv.height=N;
  const cc=cv.getContext('2d'), img=cc.createImageData(N,N), d=img.data, alb=DRINK[c.drink];
  const E=0.55+0.9*Math.sin(c.el*Math.PI/180);

    const u=(x+0.5)/R-1, v=1-(y+0.5)/R, r2=u*u+v*v, o=(y*N+x)*4;

    const edge=1-0.25*Math.pow(r2,6);
    for(let k=0;k<3;k++) d[o+k]=255*(1-Math.exp(-2.4*alb[k]*(0.22+L)*edge));
    d[o+3]=255;
  }
  cc.putImageData(img,0,0);
  mugTex=cv; return cv;
}
function drawMug(a){
  const c=st.cup, T=MUG.T, sT=Math.sin(T), cT=Math.cos(T), Hc=MUG.Hc, rO=MUG.rO, h=c.h;
  const S=Math.max(30, Math.min(a.w/3.4, a.h/(2*rO*sT+Hc*cT+0.35)));
  const cx=a.cx-0.25*S, cy=a.cy-S*(Hc*cT)/2+S*0.05;

  bg.addColorStop(0,'#4a3424'); bg.addColorStop(1,'#2a1c12');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  const sp=P(ux*2.2,uy*2.2,-Hc);
  const lg=ctx.createRadialGradient(sp[0],sp[1],0,sp[0],sp[1],Math.max(W,H)*0.8);

  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);

  const psi=c.hd*Math.PI/180, hc=Math.cos(psi), hs=Math.sin(psi);
  const zc=-0.86, HA=0.34, HB=0.52, th=0.16, ex=0.72;
  const half=(aa,bb)=>{ const q=[]; for(let i=0;i<=32;i++){ const f=-Math.PI/2+Math.PI*i/32, cf=Math.cos(f), sf=Math.sin(f);
    q.push([rO+0.25+aa*Math.pow(Math.max(0,cf),ex), zc-bb*Math.sign(sf)*Math.pow(Math.abs(sf),ex)]); } return q; };
  const hOut=[[rO-0.06,zc+HB+th/2],...half(HA+th/2,HB+th/2),[rO-0.06,zc-HB-th/2]];
  const hIn=[[rO,zc+HB-th/2],...half(HA-th/2,HB-th/2),[rO,zc-HB+th/2]];
  const H3=(r,z,d)=>[r*hc-d*hs, r*hs+d*hc, z];

  const shC=lab.shC; if(shC.width!==c2.width||shC.height!==c2.height){ shC.width=c2.width; shC.height=c2.height; }
  const sc=shC.getContext('2d'); sc.setTransform(1,0,0,1,0,0); sc.clearRect(0,0,shC.width,shC.height);

  };

function projectPt(p){
  const c=G3&&G3.cs; if(!c) return null;
  const d=sub3(p,c.pos), z=dot3(d,c.f), x=dot3(d,c.r)/z/c.tx+c.sx, y=dot3(d,c.u)/z/c.ty+c.sy;
  return [(x+1)/2*W,(1-y)/2*H, z];
}
function glassPointer(e){
  const g=st.gls;
  if(e.type==='pointerdown'){
    const S=glassState(), c=projectPt(S.bound.slice(0,3));
    let onGlass=false;
    if(c){ const rpx=S.bound[3]/c[2]/G3.cs.ty*H/2; onGlass=Math.hypot(e.clientX-c[0],e.clientY-c[1])<rpx*0.85; }
    G3.drag={mode:onGlass && !GLASSES[g.g].noTilt ?'tilt':'sun', x:e.clientX, y:e.clientY};
    if(G3.drag.mode==='tilt') hint('잔을 기울이는 중'); 
    return;
  }
  if(!G3.drag) return;
  const dx=e.clientX-G3.drag.x, dy=e.clientY-G3.drag.y; G3.drag.x=e.clientX; G3.drag.y=e.clientY;
  if(G3.drag.mode==='tilt'){
    // 화면 오른쪽 = cam.r, 화면 안쪽 = 카메라 앞 방향의 수평 성분
    const c=G3.cs, fr=norm3([c.f[0],0,c.f[2]]), k=0.006;
    let tx=g.tilt[0]+(c.r[0]*dx - fr[0]*dy)*k, tz=g.tilt[1]+(c.r[2]*dx - fr[2]*dy)*k;
    const m=Math.hypot(tx,tz), mx=50*Math.PI/180; if(m>mx){ tx*=mx/m; tz*=mx/m; }
    g.tilt=[tx,tz];
  } else {
    g.az=((g.az+dx*0.35)%360+360)%360;
    g.el=Math.max(8,Math.min(80,g.el-dy*0.18));
    (g.rows||[]).forEach(r=>r._sync());
  }
  glassDirty();
}
function updateDial(S){
  const d=$('#dial'); if(!d) return;
  const c=G3.cs; if(!c) return;
  // 화면 기준: 오른쪽 = cam.r 수평, 위쪽(안쪽) = 카메라 앞 수평
  const fr=norm3([c.f[0],0,c.f[2]]), rr=norm3([c.r[0],0,c.r[2]]);
  const sx=S.sun[0]*rr[0]+S.sun[2]*rr[2], sz=S.sun[0]*fr[0]+S.sun[2]*fr[2], l=Math.hypot(sx,sz)||1;
  const rad=34*(1-st.gls.el/90);
  d.querySelector('#sunDot').setAttribute('cx',(46+sx/l*rad).toFixed(1));
  d.querySelector('#sunDot').setAttribute('cy',(46-sz/l*rad).toFixed(1));
  d.querySelector('#sunTxt').textContent=Math.round(st.gls.el)+'°';
}

/* ========== 조절판 ========== */
const INFO = {
  w0:['굴절 코스틱스','수영장 바닥의 빛그물','볼록한 물결은 작은 볼록렌즈처럼 빛을 모으고, 오목한 곳은 흩어요. 모인 빛이 바닥에 밝은 그물을 그려요. 화면을 누르거나 문질러 물결을 일으켜 보세요.'],
  w1:['굴절 + 분산','골판 플라스틱 너머의 햇빛','골이 진 투명판을 지난 빛이 휘어진 밝은 선으로 모여요. 한쪽이 칼처럼 또렷한 이 선이 접힘(fold) 코스틱스예요. 색마다 꺾이는 정도가 달라 무지개 테가 생겨요.'],
  w2:['굴절 코스틱스','빗방울이 떨어진 물','잔잔한 물에 떨어진 빗방울이 동그란 물결을 만들고, 그 물결이 빛을 모았다 흩었다 하며 움직이는 고리 무늬를 그려요. 화면을 눌러 직접 떨어뜨려 보세요.'],
  c:['반사 코스틱스','커피잔 속 하트','비스듬한 햇빛이 잔 안쪽 벽에 반사되어 음료 위로 모이면 하트 모양 곡선이 생겨요. 잔이 투명하지 않아도 안쪽이 반들반들하면 돼요. 화면을 끌어 해를 옮겨 보세요.']
};
function setInfo(k){ const v=Array.isArray(k)?k:INFO[k]; $('#itag').textContent=v[0]; $('#ititle').textContent=v[1]; $('#itext').textContent=v[2]; }
function seg(label, opts, get, set){
  const r=document.createElement('div'); r.className='row';
  r.innerHTML=`<div class="lab">${label}</div>`;
  const s=document.createElement('div'); s.className='seg';
  opts.forEach((o,i)=>{ const b=document.createElement('button'); b.textContent=o; if(get()===i) b.classList.add('on');
    b.onclick=()=>{ set(i); [...s.children].forEach((x,j)=>x.classList.toggle('on',j===i)); }; s.appendChild(b); });
  r.appendChild(s); return r;
}
function slider(label, min, max, step, get, set, fmt){
  const r=document.createElement('div'); r.className='row';
  r.innerHTML=`<div class="lab"><span>${label}</span><em></em></div>`;
  const em=r.querySelector('em'), inp=document.createElement('input');
  inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=get();
  em.textContent=fmt(get());
  inp.oninput=()=>{ set(+inp.value); em.textContent=fmt(+inp.value); };
  r.appendChild(inp); r._sync=()=>{ inp.value=get(); em.textContent=fmt(get()); }; return r;
}
function buildCtrls(){
  const box=$('#ctrls'); box.innerHTML='';
  const s=st.scene;
  if(s===0){
    const w=st.wave;
    setInfo('w'+w.surf);
    box.append(seg('물 표면',['수영장','골판 유리','빗방울'],()=>w.surf,i=>{ w.surf=i; w.disp=SURF_DEF[i].disp; buildCtrls(); }));
    box.append(slider('물결 세기',0.3,2.2,0.05,()=>w.amp,v=>w.amp=v,v=>v.toFixed(1)+'배'));
    box.append(slider('바닥까지 깊이',0.4,3,0.05,()=>w.depth,v=>w.depth=v,v=>v<1?'얕게':v<2?'보통':'깊게'));
    box.append(slider('무지개(분산)',0,14,0.5,()=>w.disp,v=>w.disp=v,v=>v===0?'없음':v<=1.5?'실제 물 정도':'과장 '+v+'배'));
    box.append(slider('흐르는 속도',0,2,0.05,()=>w.speed,v=>w.speed=v,v=>v===0?'멈춤':v.toFixed(1)+'배'));
    chip(w.surf===1?'접힘 코스틱스':'');
  } else if(s===1){
    const c=st.cup; setInfo('c');
    const DIR=['오른쪽','오른쪽 뒤','뒤쪽','왼쪽 뒤','왼쪽','왼쪽 앞','앞 (내 쪽)','오른쪽 앞'];
    const r1=slider('해 높이',6,70,1,()=>Math.round(c.el),v=>{c.el=v;labDirty=true;},v=>Math.round(v)+'°'+(v<15?' (해 질 녘)':v>50?' (한낮)':''));
    const r2=slider('해의 방향',0,359,1,()=>Math.round(c.az),v=>{c.az=v;labDirty=true;},v=>DIR[Math.round(v/45)%8]);
    c.rows=[r1,r2];
    box.append(r1,r2);
    box.append(slider('음료 양',15,92,1,()=>Math.round((1-c.h/MUG.Hc)*100),v=>{c.h=MUG.Hc*(1-v/100);labDirty=true;},v=>'잔의 '+Math.round(v)+'%'));
    box.append(seg('음료',['블랙커피','라떼','우유'],()=>c.drink,i=>{c.drink=i;labDirty=true;}));
    box.append(slider('손잡이 방향',0,359,1,()=>Math.round(c.hd),v=>{c.hd=v;labDirty=true;},v=>DIR[Math.round(v/45)%8]));
  } else {
    const g=st.gls, gd=GLASSES[g.g]; setInfo(gd.info);
    const r0=document.createElement('div'); r0.className='row';
    r0.innerHTML='<div class="lab">유리잔 고르기</div>';
    const pk=document.createElement('div'); pk.className='seg pick';
    GLASSES.forEach((q,i)=>{ const b=document.createElement('button'); b.textContent=q.name; if(i===g.g) b.classList.add('on');
      b.onclick=()=>{ g.g=i; g.tilt=[0,0]; buildCtrls(); glassDirty(); }; pk.appendChild(b); });
    r0.appendChild(pk); box.append(r0);
    const r1=slider('해 높이',8,80,1,()=>Math.round(g.el),v=>{g.el=v;glassDirty();},v=>Math.round(v)+'°'+(v<18?' (해 질 녘)':v>60?' (한낮)':''));
    g.rows=[r1]; box.append(r1);
    box.append(slider('무지개(분산)',0,8,0.5,()=>g.disp,v=>{g.disp=v;glassDirty();},v=>v===0?'없음 (흰빛)':v<=1?'실제 유리 정도':'과장 '+v+'배'));
    const tr=seg('식탁',['흰 천','나무','검은 돌'],()=>g.table,i=>{g.table=i;if(G3)G3.camDirty=true;});
    const rb=document.createElement('button'); rb.className='plain'; rb.textContent='잔 세우기';
    rb.onclick=()=>{ g.tilt=[0,0]; glassDirty(); };
    const sg=tr.querySelector('.seg'); sg.style.flex='1'; const line=document.createElement('div'); line.style.cssText='display:flex;gap:6px;align-items:stretch';
    sg.replaceWith(line); line.append(sg,rb); box.append(tr);
    chip(gd.noTilt?'유리구슬은 굴려도 모양이 같아요':'');
  }
}
const HINTS=['화면을 누르면 물방울이 떨어져요','화면을 끌어 해의 방향과 높이를 바꿔 보세요','잔을 끌면 기울고, 빈 곳을 끌면 해가 움직여요'];
function setScene(s){
  st.scene=s;
  document.querySelectorAll('#bar [data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===s));
  glc.style.display = G ? 'block' : 'none';
  glc.style.mixBlendMode = s===1 ? 'screen' : 'normal';
  c2.style.display = s===1 ? 'block' : 'none';
  $('#nogl').style.display = !G ? 'flex' : 'none';
  if(s!==0) chip('');
  buildCtrls(); labDirty=true; glassDirty(); $('#dial').style.display=s===2?'block':'none'; hint(HINTS[s]);
}
function setPanel(open){
  panel.classList.toggle('hide',!open); tgl.classList.toggle('on',open);
  document.body.classList.toggle('closed',!open); labDirty=true; if(G3) G3.camDirty=true;
}
document.querySelectorAll('#bar [data-s]').forEach(b=>b.onclick=()=>setScene(+b.dataset.s));
tgl.onclick=()=>setPanel(panel.classList.contains('hide'));

/* ---------- 입력 ---------- */
let down=false;
function onDown(e){ down=true; e.target.setPointerCapture?.(e.pointerId); st.scene===0 ? glPointer(e,true) : st.scene===1 ? labPointer(e) : glassPointer(e); }
function onMove(e){ if(!down) return; st.scene===0 ? glPointer(e,false) : st.scene===1 ? labPointer(e) : glassPointer(e); }
function onUp(){ down=false; lastDrop=null; if(G3){ G3.drag=null; G3.lastAct=performance.now(); } }
[glc].forEach(c=>{ c.addEventListener('pointerdown',onDown); c.addEventListener('pointermove',onMove);
  c.addEventListener('pointerup',onUp); c.addEventListener('pointercancel',onUp); });

/* ---------- 크기 ---------- */
function resize(){
  W=innerWidth; H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  if(W*H*DPR*DPR>4.2e6) DPR=Math.sqrt(4.2e6/(W*H));
  c2.width=Math.round(W*DPR); c2.height=Math.round(H*DPR);
  sizeGL(); labDirty=true; if(G3) G3.camDirty=true;
}
addEventListener('resize',resize);

/* ---------- 반복 ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(st.scene===0 && G){
    simT += dt*st.wave.speed;
    if(st.wave.surf===2 && simT>nextRain){
      addDrop((Math.random()*2-1)*view[0]*0.95,(Math.random()*2-1)*view[1]*0.95,0.6+Math.random()*0.7);
      nextRain=simT+0.35+Math.random()*0.8;
    }
    renderGL();
  } else if(st.scene===1){
    if(labDirty){ labDirty=false; labReset(); }
  } else {
    glassFrame(now);
  }
  requestAnimationFrame(frame);
}

initGL(); try{ initGlass(); }catch(e){ console.error(e); G3=null; }
resize();
setPanel(isSide() && W>=1000);
setScene(0);
// 처음 열었을 때 물방울 몇 개
setTimeout(()=>{ addDrop(-0.3*view[0],0.2,1.2); },300);
setTimeout(()=>{ addDrop(0.35*view[0],-0.25,1); },1100);
requestAnimationFrame(frame);
window.__st=st; window.__setScene=setScene; window.__setPanel=setPanel; 
})();
</script>
